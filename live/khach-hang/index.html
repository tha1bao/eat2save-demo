<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B5E3B"><title>Eat2Save – Ứng dụng khách hàng</title></head><body><div class="stage"><div class="phone"><div id="sb"></div><div id="app" class="view"></div><div class="banner"></div><div class="toast" role="status"></div></div></div><script>(async()=>{try{const p=await Promise.all(Array.from({length:10},(_,i)=>'../assets/d'+i+'.bin').map(u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u);return r.arrayBuffer()})));const t=await new Response(new Blob(p).stream().pipeThrough(new DecompressionStream('gzip'))).text();const B=JSON.parse(t);const st=document.createElement('style');st.textContent=B.css;document.head.appendChild(st);for(const k of ["qrcode", "core", "customer"]){const s=document.createElement('script');s.text=B[k];document.body.appendChild(s);}window.dispatchEvent(new Event('e2s-ready'));}catch(e){document.body.insertAdjacentHTML('beforeend','<p style="font:14px sans-serif;padding:20px">Không tải được bản demo / Demo failed to load: '+e.message+'</p>')}})();</script></body></html>
